<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestTrail Dashboard</title>
  <link rel="icon" href="../../icons/icon48.png">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="logo" href="#/recordings">
        <img src="../../icons/icon48.png" alt="" width="28" height="28">
        <span>TestTrail</span>
      </a>
      <nav class="nav">
        <a href="#/recordings" data-nav="recordings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>
          <span>Recordings</span>
        </a>
        <a href="#/reports" data-nav="reports">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h8"/></svg>
          <span>Reports</span>
        </a>
        <a href="#/settings" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
        </a>
      </nav>
      <div class="side-foot">
        <a class="live" id="live" href="#" hidden></a>
        <button class="btn ghost sm theme-btn" id="theme-toggle" title="Switch theme"></button>
      </div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>

  <div class="lightbox" id="lightbox" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <iframe id="print-frame" title="Print" class="print-frame"></iframe>
  <input type="file" id="file-input" accept=".json,application/json" hidden>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
