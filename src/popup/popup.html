<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TestTrail</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="../../icons/icon48.png" alt="" width="26" height="26">
    <div class="brand">TestTrail</div>
    <button class="btn ghost icon sm" id="open-dashboard-icon" title="Open dashboard" aria-label="Open dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
    </button>
  </header>

  <!-- Idle -->
  <section id="idle" hidden>
    <form id="start-form" class="stack">
      <label class="lbl" for="name">Scenario name</label>
      <input class="input" id="name" placeholder="e.g. Login with valid credentials" autocomplete="off" autofocus>
      <label class="lbl" for="tcid">Test case ID <span class="muted">(optional)</span></label>
      <input class="input" id="tcid" placeholder="e.g. TC-104" autocomplete="off">
      <button class="btn record big" type="submit" id="start">
        <span class="rec-dot"></span> Start recording
      </button>
      <p class="error" id="error" hidden></p>
      <p class="hint">Shortcut: <span class="kbd">Alt</span>+<span class="kbd">Shift</span>+<span class="kbd">R</span></p>
    </form>
    <div class="recent" id="recent"></div>
  </section>

  <!-- Recording -->
  <section id="recording" hidden>
    <div class="live">
      <div class="live-top">
        <span class="pill inprogress" id="live-status">Recording</span>
        <span class="timer" id="timer">00:00</span>
      </div>
      <div class="live-name" id="live-name"></div>
      <div class="live-sub"><strong id="step-count">0</strong> steps captured</div>
    </div>
    <div class="row">
      <button class="btn" id="pause"></button>
      <button class="btn record" id="stop">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg> Stop
      </button>
    </div>
    <button class="btn ghost sm goto" id="goto-tab">Show recording tab</button>
  </section>

  <footer class="foot">
    <button class="btn" id="open-dashboard">Open dashboard</button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
